name: Test & Deploy

# Ablauf:
#  - Claude pusht auf claude/issue-<nr>-...  -> 5 Min. warten (weitere Pushes starten neu)
#    -> Branch lokal in main mergen -> Prüfkette (check, Migrationen, Tests)
#    -> nur bei Grün: main pushen -> Server einspielen -> Issue schließen, Branch löschen
#  - Push auf main (z. B. manueller Merge) -> Prüfkette -> Server einspielen
#  - Manuell: Actions -> Test & Deploy -> Run workflow

on:
  push:
    branches: ['claude/**', 'main']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  APP_BASE: /var/www/vhosts/okaycomputer.de/erp.okaycomputer.de

jobs:
  test-und-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: test-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Warten, bis Claude fertig ist (5 Min. ohne neuen Push)
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: sleep 300

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude-Branch lokal in main mergen
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git merge --no-ff "origin/${GITHUB_REF_NAME}" -m "Auto-Merge ${GITHUB_REF_NAME} (Tests grün)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Pakete installieren
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pkg-config default-libmysqlclient-dev
          pip install -r requirements.txt

      - name: Prüfkette (check, Migrationen, Tests)
        env:
          DJANGO_SECRET_KEY: ci-test-key-nicht-produktiv
          DJANGO_DEBUG: "true"
          DB_ENGINE: sqlite
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test

      - name: main pushen (nur bei Grün)
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: git push origin main

  deploy:
    needs: test-und-merge
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Auf Server einspielen (mit DB-Sicherung und Rücksprung bei Fehler)
        uses: appleboy/ssh-action@v1
        env:
          APP_BASE: ${{ env.APP_BASE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: APP_BASE
          script: |
            set -euo pipefail
            cd "$APP_BASE/app"
            ALT=$(git rev-parse HEAD)
            git fetch origin main

            # 1) Datenbank sichern (die letzten 20 Sicherungen bleiben erhalten)
            wert() { grep -E "^$1=" .env | head -1 | cut -d= -f2- | sed -e "s/^[\"']//" -e "s/[\"']$//"; }
            mkdir -p "$APP_BASE/backups"
            DATEI="$APP_BASE/backups/wwok-$(date +%F-%H%M%S)-${ALT:0:7}.sql.gz"
            MYSQL_PWD="$(wert DB_PASSWORD)" mysqldump --single-transaction \
              -h "$(wert DB_HOST)" -P "$(wert DB_PORT)" -u "$(wert DB_USER)" "$(wert DB_NAME)" | gzip > "$DATEI"
            echo "DB-Sicherung: $DATEI"
            ls -1t "$APP_BASE"/backups/*.sql.gz | tail -n +21 | xargs -r rm --

            # 2) Neuen Stand einspielen
            git reset --hard origin/main
            source "$APP_BASE/venv/bin/activate"
            pip install -q -r requirements.txt
            python manage.py migrate --noinput
            python manage.py collectstatic --noinput
            sudo -n systemctl restart wwok

            # 3) Läuft die Anwendung? Sonst Code zurück auf den alten Stand
            sleep 5
            CODE=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: erp.okaycomputer.de' \
              -H 'X-Forwarded-Proto: https' http://127.0.0.1:8010/ || echo 000)
            echo "Antwort der Anwendung: HTTP $CODE"
            if [ "$CODE" = "000" ] || [ "$CODE" -ge 500 ]; then
              echo "FEHLER – setze Code zurück auf $ALT (Datenbank-Sicherung: $DATEI)"
              git reset --hard "$ALT"
              pip install -q -r requirements.txt
              sudo -n systemctl restart wwok
              exit 1
            fi

      - name: Issue schließen und Branch löschen
        if: startsWith(github.ref, 'refs/heads/claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISSUE=$(echo "${GITHUB_REF_NAME}" | sed -n 's#^claude/issue-\([0-9]*\)-.*#\1#p')
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" -R "${GITHUB_REPOSITORY}" \
              --comment "✅ Tests grün, in main übernommen und live auf erp.okaycomputer.de eingespielt."
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${GITHUB_REF_NAME}" || true
