{% extends "base.html" %}
{% block titel %}{{ b.nummer }} senden – wwok{% endblock %}
{% block inhalt %}
<a href="{% url 'einkauf:bestellung' b.pk %}" data-escape style="display:none">zurück</a>
<div class="karte">
  <h1>Bestellung {{ b.nummer }} per E-Mail senden</h1>
  <form method="post">{% csrf_token %}
    <p><label for="an">An</label><input id="an" name="an" value="{{ an }}" style="width:100%" autofocus></p>
    <p><label for="betreff">Betreff</label><input id="betreff" name="betreff" value="{{ betreff }}" style="width:100%"></p>
    <p><label for="text">Text</label><textarea id="text" name="text" rows="10" style="width:100%">{{ text }}</textarea></p>
    <p>Anhang: <a href="{% url 'einkauf:bestellung_pdf' b.pk %}" target="_blank">{{ b.nummer }}.pdf</a></p>
    <p class="zeile"><button type="submit">Senden</button><a class="knopf leise" href="{% url 'einkauf:bestellung' b.pk %}">Abbrechen (Esc)</a></p>
  </form>
</div>
{% endblock %}
