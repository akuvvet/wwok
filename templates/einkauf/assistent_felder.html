{% comment %}Auswahlfelder für die Spaltenzuordnung (Variablen: namen, auswahl){% endcomment %}
{% with a=auswahl %}
<div><label>Bestellnummer des Lieferanten *</label><select name="sp_bestellnummer"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.bestellnummer == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>EK-Preis netto *</label><select name="sp_ek"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.ek == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Herstellernummer (für den Abgleich)</label><select name="sp_herstellernummer"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.herstellernummer == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>EAN (für den Abgleich)</label><select name="sp_ean"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.ean == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Bezeichnung</label><select name="sp_bezeichnung"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.bezeichnung == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Hersteller</label><select name="sp_hersteller"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.hersteller == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Kategorie</label><select name="sp_kategorie"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.kategorie == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Bestand beim Lieferanten</label><select name="sp_bestand"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.bestand == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Lieferzeit (Tage)</label><select name="sp_lieferzeit"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.lieferzeit == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
<div><label>Gewicht (kg)</label><select name="sp_gewicht"><option value="">– nicht zuordnen –</option>{% for n in namen %}<option value="{{ n }}" {% if a.gewicht == n %}selected{% endif %}>{{ n }}</option>{% endfor %}</select></div>
{% endwith %}
