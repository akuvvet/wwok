{% extends "base.html" %}
{% block titel %}Anmelden – wwok{% endblock %}
{% block inhalt %}
<div class="anmeldung"><div class="karte">
  <div class="marke-logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#0b5cad"/><path d="M6 9l4.5 14L16 13l5.5 10L26 9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><strong>wwok</strong><span>Warenwirtschaft</span></div></div>
  <h1>Anmelden</h1>
  {% if form.errors %}<div class="meldung error">Benutzername oder Passwort falsch.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label for="id_username">Benutzername</label>{{ form.username }}</p>
    <p><label for="id_password">Passwort</label>{{ form.password }}</p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Anmelden</button>
  </form>
</div></div>
{% endblock %}
