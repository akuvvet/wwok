{% extends "base.html" %}
{% block titel %}Anmelden – wwok{% endblock %}
{% block inhalt %}
<div class="karte" style="max-width:380px;margin:40px auto">
  <h1>Anmelden</h1>
  {% if form.errors %}<div class="meldung error">Benutzername oder Passwort falsch.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <p><label for="id_username">Benutzername</label>{{ form.username }}</p>
    <p><label for="id_password">Passwort</label>{{ form.password }}</p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Anmelden</button>
  </form>
</div>
{% endblock %}
