{% if kunde.gesperrt %}<small style="color:var(--warn)">Kunde gesperrt</small>{% else %}<small style="opacity:.7">Neuer Beleg für {{ kunde.name1|truncatechars:22 }}</small>
<form method="post" action="{% url 'verkauf:beleg_neu' kunde.pk %}">{% csrf_token %}
  {% for wert, name in arten %}{% if wert != 'LS' and wert != 'NL' %}<button name="art" value="{{ wert }}" type="submit" class="leise">{{ name }}</button>{% endif %}{% endfor %}
</form>{% endif %}
